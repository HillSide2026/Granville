openapi: 3.1.0
info:
  title: Granville API
  version: 1.0.0
  description: Granville payment orchestration platform — MSB Stage 1
servers:
  - url: http://localhost:8080
    description: Local development
security:
  - bearerAuth: []

paths:
  /customers:
    post:
      operationId: createCustomer
      summary: Create a customer
      tags: [Customers]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerInput"
      responses:
        "201":
          description: Customer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"

  /customers/{id}:
    get:
      operationId: getCustomer
      summary: Get a customer
      tags: [Customers]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Customer found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: patchCustomer
      summary: Update customer metadata
      tags: [Customers]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                metadata:
                  type: object
                  additionalProperties:
                    type: string
      responses:
        "200":
          description: Customer updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /payment-accounts:
    get:
      operationId: listPaymentAccounts
      summary: List payment accounts
      tags: [PaymentAccounts]
      responses:
        "200":
          description: Payment accounts visible to the caller
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createPaymentAccount
      summary: Open a payment account
      tags: [PaymentAccounts]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentAccountInput"
      responses:
        "201":
          description: Payment account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentAccount"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"

  /payment-accounts/{id}:
    get:
      operationId: getPaymentAccount
      summary: Get a payment account
      tags: [PaymentAccounts]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Payment account found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /payments:
    get:
      operationId: listPayments
      summary: List payment orders
      tags: [Payments]
      responses:
        "200":
          description: Payment orders visible to the caller
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentOrder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createPayment
      summary: Create a payment order
      tags: [Payments]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentOrderInput"
      responses:
        "201":
          description: Payment order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentOrder"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"

  /payments/{id}:
    get:
      operationId: getPayment
      summary: Get a payment order
      tags: [Payments]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Payment order found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentOrder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /payments/{id}/status:
    get:
      operationId: getPaymentStatus
      summary: Get canonical payment status
      tags: [Payments]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Payment status
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id:
                    type: string
                  status:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /payments/{id}/submit:
    post:
      operationId: submitPayment
      summary: Submit a payment through routing and provider runtime
      tags: [Payments]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "202":
          description: Payment submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentOrder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /payments/{id}/cancel:
    post:
      operationId: cancelPayment
      summary: Cancel a payment before completion
      tags: [Payments]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Payment cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentOrder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /payments/{id}/retry:
    post:
      operationId: retryPayment
      summary: Retry a failed or returned payment
      tags: [Payments]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "202":
          description: Payment retry queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentOrder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /webhooks/{provider}:
    post:
      operationId: receiveWebhook
      summary: Receive and durably store a provider webhook
      tags: [Webhooks]
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "202":
          description: Webhook accepted
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id:
                    type: string
                  status:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /reconciliation/runs:
    post:
      operationId: runReconciliation
      summary: Start a transaction-level reconciliation run
      tags: [Reconciliation]
      responses:
        "202":
          description: Reconciliation queued
          content:
            application/json:
              schema:
                type: object
                required: [runId, exceptionCount]
                properties:
                  runId:
                    type: string
                  exceptionCount:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /reconciliation/exceptions:
    get:
      operationId: getReconciliationExceptions
      summary: List open reconciliation exceptions
      tags: [Reconciliation]
      responses:
        "200":
          description: Reconciliation exceptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReconciliationException"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/audit-events:
    get:
      operationId: getAuditEvents
      summary: List all audit events
      tags: [Admin]
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/customers:
    get:
      operationId: adminGetCustomers
      summary: List all customers
      tags: [Admin]
      responses:
        "200":
          description: All customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/payment-accounts:
    get:
      operationId: adminGetPaymentAccounts
      summary: List all payment accounts
      tags: [Admin]
      responses:
        "200":
          description: All payment accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/payments:
    get:
      operationId: adminGetPayments
      summary: List all payment orders
      tags: [Admin]
      responses:
        "200":
          description: All payment orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentOrder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/payment-attempts:
    get:
      operationId: adminGetPaymentAttempts
      summary: List all payment attempts
      tags: [Admin]
      responses:
        "200":
          description: All payment attempts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentAttempt"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/provider-transactions:
    get:
      operationId: adminGetProviderTransactions
      summary: List all provider transactions
      tags: [Admin]
      responses:
        "200":
          description: All provider transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProviderTransaction"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/webhook-events:
    get:
      operationId: adminGetWebhookEvents
      summary: List all webhook events
      tags: [Admin]
      responses:
        "200":
          description: All webhook events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WebhookEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/ledger-postings:
    get:
      operationId: adminGetLedgerPostings
      summary: List all ledger queue items
      tags: [Admin]
      responses:
        "200":
          description: All ledger queue items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LedgerQueueItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/reconciliation/runs:
    get:
      operationId: adminGetReconciliationRuns
      summary: List all reconciliation runs
      tags: [Admin]
      responses:
        "200":
          description: All reconciliation runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReconciliationRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/reconciliation/exceptions:
    get:
      operationId: adminGetReconciliationExceptions
      summary: List all reconciliation exceptions
      tags: [Admin]
      responses:
        "200":
          description: All reconciliation exceptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReconciliationException"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/webhooks/{id}/retry:
    post:
      operationId: adminRetryWebhook
      summary: Re-queue a failed or ignored webhook for reprocessing
      tags: [Admin]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Webhook re-queued
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id:
                    type: string
                  status:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/ledger-postings/{id}/retry:
    post:
      operationId: adminRetryLedgerPosting
      summary: Replay a dead-lettered ledger posting
      tags: [Admin]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Ledger posting replayed
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id:
                    type: string
                  status:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/reconciliation/exceptions/{id}/resolve:
    post:
      operationId: adminResolveException
      summary: Manually resolve a reconciliation exception
      tags: [Admin]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                resolvedBy:
                  type: string
                note:
                  type: string
      responses:
        "200":
          description: Exception resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationException"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/providers/{id}/disable:
    post:
      operationId: adminDisableProvider
      summary: Disable a provider binding
      tags: [Admin]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Provider disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderBinding"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/metrics:
    get:
      operationId: getMetrics
      summary: Platform metrics snapshot
      tags: [Admin]
      responses:
        "200":
          description: Metrics snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformMetrics"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/reports/payment-history:
    get:
      operationId: getPaymentHistory
      summary: Payment history report
      tags: [Admin]
      parameters:
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Payment history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentHistoryRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/reports/audit-export:
    get:
      operationId: getAuditExport
      summary: Audit log export in NDJSON format
      tags: [Admin]
      parameters:
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
      responses:
        "200":
          description: NDJSON audit export
          content:
            application/x-ndjson:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/reports/settlement:
    get:
      operationId: getSettlement
      summary: Settlement summary report
      tags: [Admin]
      parameters:
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
      responses:
        "200":
          description: Settlement lines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SettlementLine"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/notes:
    post:
      operationId: adminAddNote
      summary: Attach a manual note to any resource
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resourceType, resourceId, note]
              properties:
                resourceType:
                  type: string
                resourceId:
                  type: string
                note:
                  type: string
      responses:
        "201":
          description: Note recorded as audit event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEvent"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/routing-rules:
    get:
      operationId: listRoutingRules
      summary: List all routing rules
      tags: [Admin]
      responses:
        "200":
          description: All routing rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoutingRule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createRoutingRule
      summary: Create a routing rule
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoutingRuleInput"
      responses:
        "201":
          description: Routing rule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutingRule"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/routing-rules/{id}:
    get:
      operationId: getRoutingRule
      summary: Get a routing rule
      tags: [Admin]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Routing rule found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutingRule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateRoutingRule
      summary: Update a routing rule
      tags: [Admin]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoutingRuleInput"
      responses:
        "200":
          description: Routing rule updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutingRule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/routing-rules/{id}/deactivate:
    post:
      operationId: deactivateRoutingRule
      summary: Deactivate a routing rule
      tags: [Admin]
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Routing rule deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutingRule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FromDate:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
    ToDate:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date-time

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GranvilleError"
    ValidationError:
      description: Invalid request body or parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GranvilleError"
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GranvilleError"
    Forbidden:
      description: Insufficient role
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GranvilleError"
    IdempotencyConflict:
      description: Idempotency key reused with a different request body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GranvilleError"
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GranvilleError"

  schemas:
    GranvilleError:
      type: object
      required: [error]
      properties:
        error:
          type: object
