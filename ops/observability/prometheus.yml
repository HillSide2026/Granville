global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: granville-api
    static_configs:
      - targets: ["granville-api:8080"]
    metrics_path: /admin/metrics
    scheme: http
    params: {}
    # The metrics endpoint returns JSON, not Prometheus exposition format.
    # Use json_exporter or a sidecar to convert; or wire OTel SDK in the app.
    honor_labels: true

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: ledger
    static_configs:
      - targets: ["ledger:3068"]
    metrics_path: /_/metrics
