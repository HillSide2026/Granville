name: granville-local

networks:
  granville: {}

volumes:
  ledger-postgres: {}
  payments-postgres: {}

services:
  ledger-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - granville
    volumes:
      - ledger-postgres:/var/lib/postgresql/data

  ledger-worker:
    image: golang:1.26-alpine
    working_dir: /workspace/ledger
    command: ["go", "run", "./", "worker"]
    depends_on:
      ledger-postgres:
        condition: service_healthy
    environment:
      GOWORK: off
      POSTGRES_URI: postgresql://ledger:ledger@ledger-postgres/ledger?sslmode=disable
      POSTGRES_MAX_OPEN_CONNS: "40"
      POSTGRES_MAX_IDLE_CONNS: "40"
      POSTGRES_CONN_MAX_IDLE_TIME: "5m"
    networks:
      - granville
    volumes:
      - ../:/workspace/ledger

  ledger:
    image: golang:1.26-alpine
    working_dir: /workspace/ledger
    command:
      - go
      - run
      - ./
      - serve
      - --worker-grpc-address
      - ledger-worker:8081
    depends_on:
      ledger-postgres:
        condition: service_healthy
      ledger-worker:
        condition: service_started
    environment:
      GOWORK: off
      POSTGRES_URI: postgresql://ledger:ledger@ledger-postgres/ledger?sslmode=disable
      POSTGRES_MAX_OPEN_CONNS: "40"
      POSTGRES_MAX_IDLE_CONNS: "40"
      POSTGRES_CONN_MAX_IDLE_TIME: "5m"
      EXPERIMENTAL_FEATURES: "true"
      AUTO_UPGRADE: "true"
    networks:
      - granville
    ports:
      - "3068:3068"
    volumes:
      - ../:/workspace/ledger

  payments-postgres:
    profiles: ["payments"]
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - granville
    volumes:
      - payments-postgres:/var/lib/postgresql/data

  payments-temporal:
    profiles: ["payments"]
    image: temporalio/auto-setup:1.29.1
    depends_on:
      payments-postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: payments
      POSTGRES_PWD: payments
      POSTGRES_SEEDS: payments-postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    networks:
      - granville
    ports:
      - "7233:7233"
    volumes:
      - ../vendor/formance-payments/local_env/postgres/temporal-sql.yaml:/etc/temporal/config/dynamicconfig/development-sql.yaml

  payments-migrate:
    profiles: ["payments"]
    image: golang:1.26-alpine
    working_dir: /workspace/payments
    command: ["go", "run", "./", "migrate", "up"]
    depends_on:
      payments-postgres:
        condition: service_healthy
    environment:
      POSTGRES_URI: postgres://payments:payments@payments-postgres:5432/payments?sslmode=disable
      CONFIG_ENCRYPTION_KEY: granville-local-config-key
    networks:
      - granville
    volumes:
      - ../vendor/formance-payments:/workspace/payments

  payments-worker:
    profiles: ["payments"]
    image: golang:1.26-alpine
    working_dir: /workspace/payments
    command: ["go", "run", "./", "worker"]
    depends_on:
      payments-postgres:
        condition: service_healthy
      payments-migrate:
        condition: service_completed_successfully
      payments-temporal:
        condition: service_started
    environment:
      POSTGRES_URI: postgres://payments:payments@payments-postgres:5432/payments?sslmode=disable
      CONFIG_ENCRYPTION_KEY: granville-local-config-key
      TEMPORAL_ADDRESS: payments-temporal:7233
      TEMPORAL_NAMESPACE: default
      PLUGIN_MAGIC_COOKIE: granville-local-plugin-cookie
      STACK: granville-local
      STACK_URL: http://payments:8080
      STACK_PUBLIC_URL: http://localhost:8088
    networks:
      - granville
    volumes:
      - ../vendor/formance-payments:/workspace/payments

  payments:
    profiles: ["payments"]
    image: golang:1.26-alpine
    working_dir: /workspace/payments
    command: ["go", "run", "./", "server"]
    depends_on:
      payments-postgres:
        condition: service_healthy
      payments-migrate:
        condition: service_completed_successfully
      payments-temporal:
        condition: service_started
    environment:
      POSTGRES_URI: postgres://payments:payments@payments-postgres:5432/payments?sslmode=disable
      CONFIG_ENCRYPTION_KEY: granville-local-config-key
      TEMPORAL_ADDRESS: payments-temporal:7233
      TEMPORAL_NAMESPACE: default
      PLUGIN_MAGIC_COOKIE: granville-local-plugin-cookie
      STACK: granville-local
      STACK_URL: http://payments:8080
      STACK_PUBLIC_URL: http://localhost:8088
    networks:
      - granville
    ports:
      - "8088:8080"
    volumes:
      - ../vendor/formance-payments:/workspace/payments
