name: granville-camunda-local

networks:
  camunda: {}

volumes:
  camunda-zeebe: {}
  camunda-elasticsearch: {}
  camunda-keycloak-postgres: {}

services:
  zeebe:
    image: camunda/zeebe:8.7.0
    environment:
      ZEEBE_BROKER_CLUSTER_CLUSTERNAME: granville-zeebe
      ZEEBE_BROKER_CLUSTER_PARTITIONSCOUNT: "1"
      ZEEBE_BROKER_CLUSTER_REPLICATIONFACTOR: "1"
      ZEEBE_BROKER_CLUSTER_CLUSTERSIZE: "1"
      ZEEBE_BROKER_GATEWAY_SECURITY_AUTHENTICATION_MODE: none
      ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_CLASSNAME: io.camunda.zeebe.exporter.ElasticsearchExporter
      ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_URL: http://elasticsearch:9200
      JAVA_TOOL_OPTIONS: "-Xms512m -Xmx512m"
    ports:
      - "26500:26500"
      - "9600:9600"
    networks:
      - camunda
    volumes:
      - camunda-zeebe:/usr/local/zeebe/data
    depends_on:
      elasticsearch:
        condition: service_healthy

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    networks:
      - camunda
    volumes:
      - camunda-elasticsearch:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  operate:
    image: camunda/operate:8.7.0
    environment:
      CAMUNDA_OPERATE_ZEEBE_GATEWAYADDRESS: zeebe:26500
      CAMUNDA_OPERATE_ELASTICSEARCH_URL: http://elasticsearch:9200
      CAMUNDA_OPERATE_ZEEBEELASTICSEARCH_URL: http://elasticsearch:9200
      CAMUNDA_OPERATE_IDENTITY_ENABLED: "false"
    ports:
      - "8082:8080"
    networks:
      - camunda
    depends_on:
      zeebe:
        condition: service_started
      elasticsearch:
        condition: service_healthy

  tasklist:
    image: camunda/tasklist:8.7.0
    environment:
      CAMUNDA_TASKLIST_ZEEBE_GATEWAYADDRESS: zeebe:26500
      CAMUNDA_TASKLIST_ELASTICSEARCH_URL: http://elasticsearch:9200
      CAMUNDA_TASKLIST_ZEEBEELASTICSEARCH_URL: http://elasticsearch:9200
      CAMUNDA_TASKLIST_IDENTITY_ENABLED: "false"
    ports:
      - "8083:8080"
    networks:
      - camunda
    depends_on:
      zeebe:
        condition: service_started
      elasticsearch:
        condition: service_healthy

  optimize:
    image: camunda/optimize:8.7.0
    environment:
      OPTIMIZE_ZEEBE_ENABLED: "true"
      CAMUNDA_OPTIMIZE_ZEEBE_GATEWAYADDRESS: zeebe:26500
      CAMUNDA_OPTIMIZE_ELASTICSEARCH_URL: http://elasticsearch:9200
    ports:
      - "8084:8090"
    networks:
      - camunda
    depends_on:
      zeebe:
        condition: service_started
      elasticsearch:
        condition: service_healthy

  keycloak-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
      POSTGRES_DB: keycloak
    networks:
      - camunda
    volumes:
      - camunda-keycloak-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 6

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: ["start-dev"]
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "18080:8080"
    networks:
      - camunda
    depends_on:
      keycloak-postgres:
        condition: service_healthy

  identity:
    image: camunda/identity:8.7.0
    environment:
      SERVER_PORT: "8080"
      IDENTITY_AUTH_PROVIDER_BACKEND_URL: http://keycloak:8080
      IDENTITY_AUTH_PROVIDER_ISSUER_URL: http://localhost:18080/realms/camunda-platform
      IDENTITY_DATABASE_HOST: keycloak-postgres
      IDENTITY_DATABASE_PORT: "5432"
      IDENTITY_DATABASE_NAME: keycloak
      IDENTITY_DATABASE_USERNAME: keycloak
      IDENTITY_DATABASE_PASSWORD: keycloak
    ports:
      - "8085:8080"
    networks:
      - camunda
    depends_on:
      keycloak:
        condition: service_started
